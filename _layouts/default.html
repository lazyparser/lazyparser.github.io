<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="dark light">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/stylesheets/site.css' | relative_url }}">
    <script src="{{ '/javascripts/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Wei Wu — home">
          <span class="brand-mark" aria-hidden="true">W<span>.</span></span>
          <span class="brand-name">WEI WU <span>/ @LAZYPARSER</span></span>
        </a>
        <div class="header-controls">
          <nav class="language-switch" aria-label="Language">
            <button type="button" data-locale="en" aria-pressed="true">EN</button>
            <span aria-hidden="true">/</span>
            <button type="button" data-locale="zh" aria-pressed="false">中文</button>
          </nav>
          <button class="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span data-i18n="theme.dark">Dark mode</span>
          </button>
        </div>
      </header>

      <main class="site-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <span data-i18n="footer">Made with curiosity and open source.</span>
        <a href="https://github.com/lazyparser" rel="noopener noreferrer">GITHUB ↗</a>
      </footer>
    </div>
  </body>
</html>
