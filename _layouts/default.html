<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo title=false %}
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true">WW</span>
          <span>
            Wei Wu
            <span class="brand-tagline">@lazyparser</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Site navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/blog.cn.html' | relative_url }}"{% if page.url == '/blog.cn.html' or page.url contains '/hellocompiler/' %} aria-current="page"{% endif %}>博客</a>
          <a href="https://github.com/lazyparser/talks" rel="noopener">Talks</a>
          <a class="icon-link" href="{{ site.github_url }}" title="GitHub" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2.1c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
            <span class="sr-only">GitHub</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-row">
          <span>© {{ site.time | date: "%Y" }} Wei Wu</span>
          <a href="https://github.com/{{ site.repository }}" rel="noopener">Site source</a>
        </div>
        {% if site.friend_links %}
        <div class="footer-row">
          <span class="footer-label">Community</span>
          {% for link in site.friend_links %}<a href="{{ link.url }}" rel="noopener">{{ link.name }}</a>{% endfor %}
        </div>
        {% endif %}
      </div>
    </footer>
  </body>
</html>
